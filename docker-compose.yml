version: "3.8"

services:
  backend:
    build: ./backend
    container_name: express_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/mydb
      - JWT_SECRET=secret_key
    depends_on:
      - mongo
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: react_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
